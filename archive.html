<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Substation Squirrel Sleuths | Archive</title>
  <script src="auth.js"></script>
  <script>Auth.requireAuth();</script>
  <style>
    :root{
      --bg:#11161a;
      --ink:#e7edf2;
      --muted:#9aa7b4;
      --card:#1a2228;
      --line:#2c3943;
      --accent:#0f3f76;
      --accent-soft:#1f3d43;
      --font-head:"Space Grotesk","Segoe UI",sans-serif;
      --font-body:"IBM Plex Sans","Segoe UI",sans-serif;
      --font-mono:"IBM Plex Mono","Cascadia Mono",monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--ink);
      font-family:var(--font-body);
      background:var(--bg);
    }
    .shell{max-width:1180px;margin:0 auto;padding:22px 18px 44px}
    .top{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      margin-bottom:16px;flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;
      display:grid;place-items:center;font:700 13px/1 var(--font-head);letter-spacing:.05em;
    }
    h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.02em}
    h1{font-size:1.3rem}
    .sub{color:var(--muted);font-size:.92rem}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{
      border:1px solid var(--line);background:#1f2930;color:var(--ink);text-decoration:none;
      border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;
    }
    .pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .pill:hover{filter:brightness(.97)}
    .panel{
      margin:14px 0 18px;padding:16px;border:1px solid var(--line);border-radius:18px;
      background:#182026;
    }
    .meta{
      margin-top:8px;display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;
    }
    .chip{
      border:1px solid var(--line);background:#151c21;border-radius:12px;padding:10px;
    }
    .chip small{color:var(--muted)}
    .chip strong{display:block;margin-top:2px;font-size:1.1rem;font-family:var(--font-head)}
    .card{
      border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;
      margin-bottom:14px;
    }
    .card h3{font-size:1rem;margin-bottom:10px}
    table{width:100%;border-collapse:collapse;font-size:.88rem}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{font-family:var(--font-head);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
    .muted{color:var(--muted)}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
    .shot{border:1px solid var(--line);background:#151c21;border-radius:11px;overflow:hidden}
    .shot img{width:100%;height:90px;object-fit:cover;display:block}
    .shot div{padding:7px;font-size:.72rem;color:var(--muted);font-family:var(--font-mono)}
    .action{display:flex;gap:8px;flex-wrap:wrap}
    @media (max-width:900px){
      .meta{grid-template-columns:repeat(2,minmax(120px,1fr))}
      th:nth-child(5),td:nth-child(5){min-width:220px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <div class="logo">SSS</div>
        <div>
          <h1>Substation Squirrel Sleuths</h1>
          <div class="sub">Archive and playback catalog</div>
        </div>
      </div>
      <nav class="row">
        <a class="pill" href="dashboard.html">Dashboard</a>
        <a class="pill active" href="archive.html">Archive</a>
        <a class="pill" href="#" id="logoutLink">Logout</a>
      </nav>
    </header>

    <section class="panel">
      <h2>Archive Overview</h2>
      <div class="meta">
        <div class="chip"><small>Days Indexed</small><strong id="daysCount">0</strong></div>
        <div class="chip"><small>Total Events</small><strong id="eventsTotal">0</strong></div>
        <div class="chip"><small>Total Images</small><strong id="imagesTotal">0</strong></div>
        <div class="chip"><small>Total Videos</small><strong id="videosTotal">0</strong></div>
      </div>
    </section>

    <section class="card">
      <h3>Daily Runs</h3>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr><th>Day</th><th>Events</th><th>Images</th><th>Videos</th><th>Actions</th></tr>
          </thead>
          <tbody id="archiveRows"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h3>Preview Stills</h3>
      <div id="previewGrid" class="gallery"></div>
    </section>
  </main>

  <script src="demo-data.js"></script>
  <script>
    const days = (window.DEMO_DATA && window.DEMO_DATA.days) || [];
    const archive = days.map((d) => ({
      day: d.day,
      events: d.events.length,
      images: d.images.length,
      videos: d.videos.length,
      pack: d.videos[0] || "#"
    }));

    const previews = days
      .flatMap((d) => d.images)
      .slice(0, 6)
      .map((src) => ({ src, name: src.split("/").pop() }));

    const totals = archive.reduce((acc, row) => {
      acc.events += row.events;
      acc.images += row.images;
      acc.videos += row.videos;
      return acc;
    }, { events: 0, images: 0, videos: 0 });

    document.getElementById("daysCount").textContent = archive.length;
    document.getElementById("eventsTotal").textContent = totals.events;
    document.getElementById("imagesTotal").textContent = totals.images;
    document.getElementById("videosTotal").textContent = totals.videos;

    const archiveRows = document.getElementById("archiveRows");
    archive.forEach((row) => {
      const dayLink = `day.html?day=${encodeURIComponent(row.day)}`;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${row.day}</strong></td>
        <td>${row.events}</td>
        <td>${row.images}</td>
        <td>${row.videos}</td>
        <td>
          <div class="action">
            <a class="pill" href="${dayLink}">Open</a>
            <a class="pill" href="${row.pack}" download>Download Sample</a>
          </div>
        </td>`;
      archiveRows.appendChild(tr);
    });

    const previewGrid = document.getElementById("previewGrid");
    previews.forEach((item) => {
      const card = document.createElement("article");
      card.className = "shot";
      card.innerHTML = `<img src="${item.src}" alt="${item.name}" loading="lazy"><div>${item.name}</div>`;
      previewGrid.appendChild(card);
    });

    document.getElementById("logoutLink").addEventListener("click", (event) => {
      event.preventDefault();
      Auth.logout();
    });
  </script>
</body>
</html>
