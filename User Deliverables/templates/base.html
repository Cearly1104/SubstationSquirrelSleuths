<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Substation Squirrel Sleuths | {% block title %}Home{% endblock %}</title>
  <style>
    :root{
      --bg:#11161a;
      --ink:#e7edf2;
      --muted:#9aa7b4;
      --card:#1a2228;
      --line:#2c3943;
      --accent:#0f3f76;
      --accent-soft:#1f3d43;
      --alert:#f59e0b;
      --font-head:"Space Grotesk","Segoe UI",sans-serif;
      --font-body:"IBM Plex Sans","Segoe UI",sans-serif;
      --font-mono:"IBM Plex Mono","Cascadia Mono",monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);font-family:var(--font-body);background:var(--bg)}
    .shell{max-width:1180px;margin:0 auto;padding:22px 18px 44px}
    .top{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      margin-bottom:16px;flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;
      display:grid;place-items:center;font:700 13px/1 var(--font-head);letter-spacing:.05em;
    }
    h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.02em}
    h1{font-size:1.3rem}
    .sub{color:var(--muted);font-size:.92rem}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{
      border:1px solid var(--line);background:#1f2930;color:var(--ink);text-decoration:none;
      border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;
    }
    .pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .pill:hover{filter:brightness(.97)}
    .card{
      border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;
      animation:rise .55s ease both;
    }
    .card h3{font-size:1.03rem;margin-bottom:12px}
    table{width:100%;border-collapse:collapse;font-size:.86rem}
    th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{font-family:var(--font-head);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
    .muted{color:var(--muted)}
    .alert{color:var(--alert);font-weight:700}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:10px}
    .thumb{
      border:1px solid var(--line);border-radius:12px;background:#151c21;overflow:hidden;
      transition:transform .22s ease, box-shadow .22s ease;
    }
    .thumb:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(31,35,41,.12)}
    .thumb img{display:block;width:100%;height:116px;object-fit:cover;background:#11161a;cursor:zoom-in}
    .cap{
      padding:8px 9px;font-size:.75rem;color:var(--muted);font-family:var(--font-mono);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    video{width:100%;border-radius:12px;background:#000;border:1px solid var(--line)}
    .video-list{display:grid;gap:8px;margin-top:10px}
    .video-item{
      border:1px solid var(--line);border-radius:10px;background:#151c21;padding:9px;
      display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;
    }
    .video-item button{
      border:0;background:var(--accent-soft);color:#dff5f3;border-radius:999px;
      padding:6px 10px;cursor:pointer;font-weight:700;
    }
    .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px}
    .system-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}
    .stat{border:1px solid var(--line);background:#151c21;border-radius:12px;padding:12px}
    .stat small{color:var(--muted)}
    .stat strong{display:block;font-size:1.25rem;font-family:var(--font-head);margin-top:3px}
    .empty{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);background:#151c21}
    @keyframes rise{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    @media (max-width:930px){
      .stat-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}
      .system-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}
    }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  {% block body %}{% endblock %}

  <!-- Lightbox -->
  <div id="lb" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;">
    <img id="lb-img" style="max-width:95vw;max-height:92vh;border-radius:10px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.6);pointer-events:none;">
  </div>
  <script>
  (function () {
    document.addEventListener('click', function (e) {
      const img = e.target.closest('.thumb img');
      if (!img) return;
      const lb = document.getElementById('lb');
      document.getElementById('lb-img').src = img.src;
      lb.style.display = 'flex';
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') document.getElementById('lb').style.display = 'none';
    });
  })();
  </script>
</body>
</html>
